version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: udyamone-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - TODAY_DATE=2026-07-15
      - DPDP_CONSENT_VERSION=DPDP-2026-V1.0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: udyamone-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

